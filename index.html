<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETHOS ENGINE : 윤리 회로도 & 동적 평형 시뮬레이터</title>
<style>
  :root {
    --bg: #0b0f19;
    --panel: #131b2e;
    --panel-alt: #1a2540;
    --border: #2a395c;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --good: #4ade80;
    --bad: #f87171;
    --warn: #fbbf24;
    --purple: #c084fc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* Header */
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 1.05rem;
    color: var(--accent);
    letter-spacing: -0.3px;
  }
  .brand span.sub {
    font-size: 0.78rem;
    color: var(--muted);
    font-weight: 500;
  }
  .nav-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .nav-tab {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 13px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 600;
    transition: 0.15s;
  }
  .nav-tab:hover { color: var(--text); border-color: var(--accent); }
  .nav-tab.active {
    background: rgba(56, 189, 248, 0.16);
    color: var(--accent);
    border-color: var(--accent);
  }
  .search-box {
    position: relative;
    width: 230px;
  }
  .search-box input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.8rem;
  }
  .search-results {
    position: absolute;
    top: 34px;
    right: 0;
    width: 320px;
    max-height: 360px;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 8px;
    z-index: 100;
    display: none;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6);
  }
  .search-item {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 0.8rem;
  }
  .search-item:hover { background: var(--panel-alt); }
  .search-item b { color: var(--accent); }

  /* Main Layout */
  .workspace {
    display: grid;
    grid-template-columns: 260px 1fr 370px;
    flex: 1;
    min-height: 0;
  }
  /* Left Sidebar */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .cat-title {
    font-size: 0.73rem;
    text-transform: uppercase;
    color: var(--muted);
    margin: 8px 4px 4px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .item-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 11px;
    border-radius: 6px;
    text-align: left;
    cursor: pointer;
    font-size: 0.83rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.12s;
  }
  .item-btn:hover { border-color: var(--accent); }
  .item-btn.active {
    background: rgba(56, 189, 248, 0.14);
    border-color: var(--accent);
    color: #fff;
    font-weight: 700;
  }
  .badge {
    font-size: 0.68rem;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--panel-alt);
    color: var(--accent);
    border: 1px solid var(--border);
  }

  /* Center Canvas Area */
  .stage {
    position: relative;
    background: radial-gradient(circle at center, #11192e 0%, #070a12 100%);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .hud-top {
    position: absolute;
    top: 14px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    gap: 12px;
  }
  .hud-card {
    background: rgba(19, 27, 46, 0.88);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: 10px;
    max-width: 58%;
    pointer-events: auto;
  }
  .hud-title {
    font-size: 1.15rem;
    font-weight: 800;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hud-hanja {
    color: var(--warn);
    font-weight: 700;
    font-size: 0.95rem;
    background: rgba(251, 191, 36, 0.12);
    padding: 2px 7px;
    border-radius: 4px;
  }
  .hud-desc {
    font-size: 0.82rem;
    color: #cbd5e1;
    margin-top: 6px;
    line-height: 1.45;
  }
  .hud-metrics {
    background: rgba(19, 27, 46, 0.88);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 10px;
    min-width: 195px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .metric-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    gap: 10px;
  }
  .metric-val { font-weight: 700; color: var(--accent); }
  .hud-bottom {
    position: absolute;
    bottom: 14px;
    left: 16px;
    right: 16px;
    background: rgba(19, 27, 46, 0.92);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.8rem;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .hanja-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 4px 9px;
    border-radius: 5px;
    font-size: 0.77rem;
  }
  .hanja-chip b { color: var(--warn); margin-right: 4px; }

  /* Right Control Panel */
  .control-panel {
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .panel-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  .panel-box h3 {
    font-size: 0.86rem;
    color: var(--accent);
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ctrl-row {
    margin-bottom: 10px;
  }
  .ctrl-row:last-child { margin-bottom: 0; }
  .ctrl-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    margin-bottom: 4px;
    color: #cbd5e1;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .preset-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .preset-btn {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 0.76rem;
    cursor: pointer;
    transition: 0.12s;
  }
  .preset-btn:hover, .preset-btn.active {
    border-color: var(--accent);
    background: rgba(56, 189, 248, 0.2);
    color: #fff;
  }
  .gate-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 8px;
    border-radius: 5px;
    background: var(--panel);
    margin-bottom: 5px;
    font-size: 0.78rem;
    border-left: 3px solid var(--border);
  }
  .gate-item.pass { border-left-color: var(--good); }
  .gate-item.fail { border-left-color: var(--bad); }
  .status-pill {
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .status-pill.pass { background: rgba(74,222,128,0.18); color: var(--good); }
  .status-pill.fail { background: rgba(248,113,113,0.18); color: var(--bad); }

  .point-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.79rem;
    line-height: 1.45;
    color: #cbd5e1;
  }
  .point-list li {
    padding-left: 10px;
    border-left: 2px solid var(--accent);
  }
  .point-list li b { color: #fff; }

  /* OX Quiz Overlay */
  .quiz-container {
    padding: 20px;
    overflow-y: auto;
    height: 100%;
    display: none;
  }
  .quiz-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .quiz-q { font-size: 0.9rem; font-weight: 600; line-height: 1.4; }
  .quiz-actions { display: flex; gap: 8px; align-items: center; }
  .ox-btn {
    padding: 6px 18px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-weight: 800;
    cursor: pointer;
  }
  .ox-btn.correct { background: rgba(74,222,128,0.25); border-color: var(--good); color: var(--good); }
  .ox-btn.wrong { background: rgba(248,113,113,0.25); border-color: var(--bad); color: var(--bad); }
  .quiz-exp { font-size: 0.8rem; color: var(--warn); display: none; margin-top: 4px; }

  textarea.json-input {
    width: 100%;
    height: 220px;
    background: #060911;
    color: var(--good);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    font-family: monospace;
    font-size: 0.75rem;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    ⚡ ETHOS ENGINE
    <span class="sub">윤리 회로도 & 사상가 알고리즘 통합 시뮬레이터</span>
  </div>
  <div class="nav-tabs" id="modeTabs">
    <button class="nav-tab active" data-mode="nature">① 윤리학·인간본성</button>
    <button class="nav-tab" data-mode="east">② 동양 사상(한자 해독)</button>
    <button class="nav-tab" data-mode="west">③ 서양 사상(의무·공리·덕)</button>
    <button class="nav-tab" data-mode="battle">④ 사상가 배틀(벤·저울)</button>
    <button class="nav-tab" data-mode="modern">⑤ 현대 윤리 쟁점</button>
    <button class="nav-tab" data-mode="quiz">⑥ 스피드 OX 퀴즈</button>
    <button class="nav-tab" data-mode="extend">⑦ 확장(JSON)</button>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 한자·용어·사상가 즉시 검색...">
    <div class="search-results" id="searchResults"></div>
  </div>
</header>

<div class="workspace">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="stage">
    <canvas id="ethosCanvas"></canvas>
    <div class="quiz-container" id="quizContainer"></div>

    <div class="hud-top" id="hudTop">
      <div class="hud-card">
        <div class="hud-title">
          <span id="hudTitle">제목</span>
          <span class="hud-hanja" id="hudHanja"></span>
        </div>
        <div class="hud-desc" id="hudDesc">설명</div>
      </div>
      <div class="hud-metrics" id="hudMetrics"></div>
    </div>

    <div class="hud-bottom" id="hudBottom"></div>
  </main>

  <aside class="control-panel" id="controlPanel"></aside>
</div>

<script>
/* ============================================================================
   1. 통합 데이터베이스 (두 PDF의 모든 사상가, 한자어, 쟁점, OX 퀴즈 100% 수록)
   ============================================================================ */
const ETHOS_DB = {
  items: [
    // ==================== [모드 1: 윤리학의 분류 & 인간 본성] ====================
    {
      id: "ethics_branch", mode: "nature", category: "01차시 윤리학의 분류",

      hanjaList: [

        { k: "가치중립(價値中立)", m: "선악 판단을 개입시키지 않는 객관적 태도(메타·기술 공통)" }
      ],
      controls: [
        { id: "normative", label: "당위·가치 판단 개입 (규범 윤리학)", min: 0, max: 100, val: 80 },
        { id: "practical", label: "현실 문제 적용도 (이론 0 ↔ 실천 100)", min: 0, max: 100, val: 60 },
        { id: "empirical", label: "경험과학적 관습 관찰 (기술 윤리학)", min: 0, max: 100, val: 30 }

      points: [

    {

      ]
    },
    {
      id: "human_nature", mode: "nature", category: "02차시 인간 본성 논쟁",
      title: "성선설 · 성악설 · 백지설 입자 실험실", hanja: "性善·性惡·白紙", kernel: "field",
      badge: "입자물리",
      desc: "맹자·루소(성선설), 순자·홉스(성악설), 고자·로크(무선무악·백지설)가 바라본 인간의 초기 본성과 교화·제도화 방식을 입자 충돌과 발광으로 비교합니다.",
      hanjaList: [
        { k: "불인인지심(不忍人之心)", m: "차마 남의 고통을 그냥 보지 못하는 선한 마음(맹자)" },
        { k: "구방심(求放心)", m: "잃어버린 본래의 선한 마음을 되찾음(맹자)" },

/* ============================================================================
   2. 상태 관리 및 UI 자동 렌더링 엔진
   ============================================================================ */
let currentMode = "nature";
let currentItem = ETHOS_DB.items[0];
let state = {};
let particles = [];
let animTick = 0;

const canvas = document.getElementById("ethosCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
}
window.addEventListener("resize", resizeCanvas);

function initParticles(count = 55) {
  particles = [];
  const w = canvas.clientWidth || 700;
  const h = canvas.clientHeight || 500;
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * (w - 80) + 40,
      y: Math.random() * (h - 120) + 60,
      vx: (Math.random() - 0.5) * 2.2,
      vy: (Math.random() - 0.5) * 2.2,
      group: i % 4,
      hue: [195, 140, 35, 330][i % 4]
    });
  }
}

function selectMode(mode) {
  currentMode = mode;
  document.querySelectorAll(".nav-tab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.mode === mode);
  });

  const quizContainer = document.getElementById("quizContainer");
  const hudTop = document.getElementById("hudTop");
  const hudBottom = document.getElementById("hudBottom");

  if (mode === "quiz") {
    canvas.style.display = "none";
    hudTop.style.display = "none";
    hudBottom.style.display = "none";
    quizContainer.style.display = "block";
    renderQuizView();
    return;
  } else {
    canvas.style.display = "block";
    hudTop.style.display = "flex";
    hudBottom.style.display = "flex";
    quizContainer.style.display = "none";
  }

  if (mode === "extend") {
    renderExtendView();
    return;
  }

  renderSidebar();
  const first = ETHOS_DB.items.find(it => it.mode === mode);
  if (first) selectItem(first.id);
}

function renderSidebar() {
  const sb = document.getElementById("sidebar");
  sb.innerHTML = "";
  const filtered = ETHOS_DB.items.filter(it => it.mode === currentMode);
  let lastCat = "";
  filtered.forEach(item => {
    if (item.category !== lastCat) {
      lastCat = item.category;
      const catEl = document.createElement("div");
      catEl.className = "cat-title";
      catEl.textContent = lastCat;
      sb.appendChild(catEl);
    }
    const btn = document.createElement("button");
    btn.className = "item-btn" + (currentItem && currentItem.id === item.id ? " active" : "");
    btn.innerHTML = `<span>${item.title}</span><span class="badge">${item.badge}</span>`;
    btn.onclick = () => selectItem(item.id);
    sb.appendChild(btn);
  });
}

function selectItem(id) {
  const found = ETHOS_DB.items.find(it => it.id === id);
  if (!found) return;
  currentItem = found;
  state = {};
  (currentItem.controls || []).forEach(c => { state[c.id] = c.val; });
  initParticles(56);
  renderSidebar();
  renderHUD();
  renderControlPanel();
}

function renderHUD() {
  document.getElementById("hudTitle").textContent = currentItem.title;
  document.getElementById("hudHanja").textContent = currentItem.hanja || "";
  document.getElementById("hudDesc").textContent = currentItem.desc;

  const bottom = document.getElementById("hudBottom");
  bottom.innerHTML = `<span style="color:var(--accent);font-weight:700;font-size:0.76rem;">📖 핵심 한자·용어 해독:</span>`;
  (currentItem.hanjaList || []).forEach(h => {
    const chip = document.createElement("div");
    chip.className = "hanja-chip";
    chip.innerHTML = `<b>${h.k}</b> ${h.m}`;
    bottom.appendChild(chip);
  });
}

function renderControlPanel() {
  const cp = document.getElementById("controlPanel");
  cp.innerHTML = "";

  // 1. Sliders
  if (currentItem.controls && currentItem.controls.length) {
    const box = document.createElement("div");
    box.className = "panel-box";
    box.innerHTML = `<h3>🎛️ 알고리즘 변수 조작 <span>실시간 연동</span></h3>`;
    currentItem.controls.forEach(c => {
      const row = document.createElement("div");
      row.className = "ctrl-row";
      row.innerHTML = `
        <div class="ctrl-label">
          <span>${c.label}</span>
          <b id="val_${c.id}" style="color:var(--accent)">${state[c.id]}</b>
        </div>
        <input type="range" min="${c.min}" max="${c.max}" value="${state[c.id]}" id="rng_${c.id}">
      `;
      row.querySelector("input").addEventListener("input", (e) => {
        state[c.id] = Number(e.target.value);
        document.getElementById(`val_${c.id}`).textContent = state[c.id];
        updateGatesUI();
      });
      box.appendChild(row);
    });
    cp.appendChild(box);
  }

  // 2. Presets
  if (currentItem.presets && currentItem.presets.length) {
    const box = document.createElement("div");
    box.className = "panel-box";
    box.innerHTML = `<h3>⚡ 사상가·사례 원클릭 프리셋</h3><div class="preset-btns" id="presetList"></div>`;
    const list = box.querySelector("#presetList");
    currentItem.presets.forEach(p => {
      const b = document.createElement("button");
      b.className = "preset-btn";
      b.textContent = p.label;
      b.onclick = () => {
        Object.keys(p.set).forEach(k => {
          state[k] = p.set[k];
          const r = document.getElementById(`rng_${k}`);
          const v = document.getElementById(`val_${k}`);
          if (r) r.value = state[k];
          if (v) v.textContent = state[k];
        });
        updateGatesUI();
      };
      list.appendChild(b);
    });
    cp.appendChild(box);
  }

  // 3. Logic Gates (if present)
  if (currentItem.gates) {
    const box = document.createElement("div");
    box.className = "panel-box";
    box.innerHTML = `<h3>🚦 사상가별 논리 게이트 판정</h3><div id="gatesBox"></div>`;
    cp.appendChild(box);
  }

  // 4. Exam Key Points
  if (currentItem.points) {
    const box = document.createElement("div");
    box.className = "panel-box";
    box.innerHTML = `<h3>📌 시험 출제 핵심 포인트 비교</h3><ul class="point-list">
      ${currentItem.points.map(pt => `<li>${pt}</li>`).join("")}
    </ul>`;
    cp.appendChild(box);
  }

  updateGatesUI();
}

function updateGatesUI() {
  const gb = document.getElementById("gatesBox");
  if (!gb || !currentItem.gates) return;
  gb.innerHTML = "";
  currentItem.gates.forEach(g => {
    const pass = g.check(state);
    const el = document.createElement("div");
    el.className = "gate-item " + (pass ? "pass" : "fail");
    el.innerHTML = `
      <div>
        <div style="font-weight:700;color:#fff;">${g.who}</div>
        <div style="font-size:0.71rem;color:var(--muted);margin-top:2px;">${g.rule}</div>
      </div>
      <span class="status-pill ${pass ? 'pass' : 'fail'}">${pass ? '정당화 PASS' : '기각 FAIL'}</span>
    `;
    gb.appendChild(el);
  });
}

function updateMetrics(metricsArr) {
  const mBox = document.getElementById("hudMetrics");
  if (!mBox) return;
  mBox.innerHTML = metricsArr.map(m => `
    <div class="metric-row">
      <span style="color:var(--muted)">${m.k}</span>
      <span class="metric-val" style="color:${m.c || 'var(--accent)'}">${m.v}</span>
    </div>
  `).join("");
}

/* ============================================================================
   3. 단일 통합 캔버스 시각화 커널 (10대 물리·회로·다이어그램 엔진)
   ============================================================================ */
function renderLoop() {
  animTick++;
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  if (w && h && currentMode !== "quiz") {
    ctx.clearRect(0, 0, w, h);
    const k = currentItem.kernel;
    if (k === "field") drawFieldKernel(w, h);
    else if (k === "network") drawNetworkKernel(w, h);
    else if (k === "circuit") drawCircuitKernel(w, h);
    else if (k === "universal") drawUniversalKernel(w, h);
    else if (k === "score") drawScoreKernel(w, h);
    else if (k === "spectrum") drawSpectrumKernel(w, h);
    else if (k === "venn") drawVennKernel(w, h);
    else if (k === "scale") drawScaleKernel(w, h);
    else if (k === "ripple") drawRippleKernel(w, h);
    else if (k === "culture") drawCultureKernel(w, h);
    else if (k === "market") drawMarketKernel(w, h);
    else if (k === "info") drawInfoKernel(w, h);
  }
  requestAnimationFrame(renderLoop);
}

// [커널 1: field] 인간본성(성선·성악·백지), 순자 화성기위, 도가 무위자연 유체 흐름
function drawFieldKernel(w, h) {
  const isDao = currentItem.id === "daoism";
  const good = state.innateGood ?? (100 - (state.inwi ?? 20));
  const desire = state.desire ?? (state.inwi ?? 20);
  const order = state.normOrder ?? (state.waterFlow ?? 80);

  // 도가 인위(장벽) 또는 순자 예(격자 가이드) 표시
  if (isDao && desire > 25) {
    ctx.strokeStyle = "rgba(248, 113, 113, 0.55)";
    ctx.lineWidth = 3;
    const barCount = Math.floor(desire / 20);
    for (let i = 1; i <= barCount; i++) {
      const bx = (w / (barCount + 1)) * i;
      ctx.beginPath();
      ctx.moveTo(bx, h * 0.22);
      ctx.lineTo(bx, h * 0.78);
      ctx.stroke();
    }
  } else if (!isDao && order > 40) {
    ctx.strokeStyle = `rgba(56, 189, 248, ${(order - 40) / 220})`;
    ctx.lineWidth = 1;
    for (let x = 80; x < w - 60; x += 70) {
      for (let y = 100; y < h - 80; y += 70) {
        ctx.strokeRect(x - 18, y - 18, 36, 36);
      }
    }
  }

  let collisions = 0;
  particles.forEach((p, idx) => {
    if (isDao) {
      // 상선약수 물결 흐름 vs 인위 충돌
      const streamY = h * 0.5 + Math.sin((p.x * 0.012) + animTick * 0.04) * 55;
      p.vx = 2.0 + (order / 50);
      p.vy += ((streamY - p.y) * 0.02 * (order / 100)) + ((Math.random() - 0.5) * (desire / 25));
      p.x += p.vx;
      p.y += p.vy * 0.5;
      if (p.x > w - 30) p.x = 30;
    } else {
      const jitter = (desire / 100) * 3.2 * (1 - (order / 130));
      p.vx += (Math.random() - 0.5) * jitter;
      p.vy += (Math.random() - 0.5) * jitter;
      // 예(화성기위) 격자 정렬 인력
      if (order > 50) {
        const gx = 80 + (idx % 8) * ((w - 160) / 7);
        const gy = 120 + Math.floor(idx / 8) * ((h - 220) / 6);
        p.vx += (gx - p.x) * 0.03 * (order / 100);
        p.vy += (gy - p.y) * 0.03 * (order / 100);
      }
      p.vx *= 0.9;
      p.vy *= 0.9;
      p.x = Math.max(40, Math.min(w - 40, p.x + p.vx));
      p.y = Math.max(80, Math.min(h - 80, p.y + p.vy));
    }

    // 충돌 계산
    for (let j = idx + 1; j < particles.length; j++) {
      const q = particles[j];
      const dx = p.x - q.x, dy = p.y - q.y;
      if (dx * dx + dy * dy < 320 && desire > 45 && order < 70) collisions++;
    }

    // 입자 렌더링 (성선=초록 원 광채, 화성기위=하늘색 육각형, 욕망=붉은 입자)
    ctx.save();
    ctx.translate(p.x, p.y);
    if (order > 65 && good < 20) {
      // 순자 화성기위: 후천적 예로 다듬어진 정육각형
      ctx.strokeStyle = "#38bdf8";
      ctx.fillStyle = "rgba(56, 189, 248, 0.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let k = 0; k < 6; k++) {
        const ang = (Math.PI / 3) * k;
        const rx = Math.cos(ang) * 9, ry = Math.sin(ang) * 9;
        k === 0 ? ctx.moveTo(rx, ry) : ctx.lineTo(rx, ry);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else {
      const r = 7;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      if (isDao) {
        ctx.fillStyle = desire > 50 ? "#f87171" : "#38bdf8";
      } else if (good >= 60) {
        ctx.fillStyle = "#4ade80";
        ctx.shadowColor = "#4ade80";
        ctx.shadowBlur = 12;
      } else if (good >= 35) {
        ctx.fillStyle = "#cbd5e1"; // 백지설
      } else {
        ctx.fillStyle = "#f87171";
      }
      ctx.fill();
    }
    ctx.restore();
  });

  updateMetrics([
    { k: isDao ? "무위자연 조화도" : "내면적 선성(성선)", v: `${good}%`, c: "#4ade80" },
    { k: isDao ? "인위(규범·욕망) 혼란" : "이기적 욕망·갈등", v: `${desire}% (${collisions}충돌)`, c: "#f87171" },
    { k: isDao ? "상선약수 유체 평형" : "화성기위·예치 질서", v: `${order}%`, c: "#38bdf8" }
  ]);
}

// [커널 2: network] 공자 인의 확장 & 불교 연기법(인드라망)
function drawNetworkKernel(w, h) {
  const cx = w * 0.5, cy = h * 0.5;
  const isBuddha = currentItem.id === "buddhism";

  if (!isBuddha) {
    // 공자: 동심원 인(仁) 확장 + 정명
    const radius = (state.renRadius / 100) * Math.min(w, h) * 0.42;
    const rings = [
      { r: 0.28, label: "가족 (효제: 인의 출발)" },
      { r: 0.62, label: "이웃·향당 (충서·극기복례)" },
      { r: 0.95, label: "천하·대동사회 (수기안인)" }
    ];
    rings.forEach(rg => {
      const rr = Math.min(w, h) * 0.42 * rg.r;
      const active = radius >= rr * 0.9;
      ctx.beginPath();
      ctx.arc(cx, cy, rr, 0, Math.PI * 2);
      ctx.strokeStyle = active ? "rgba(74, 222, 128, 0.55)" : "rgba(148, 163, 184, 0.2)";
      ctx.lineWidth = active ? 2.5 : 1;
      ctx.stroke();
      ctx.fillStyle = active ? "#4ade80" : "#64748b";
      ctx.font = "12px Pretendard, sans-serif";
      ctx.fillText(rg.label, cx - 65, cy - rr + 16);
    });

    // 중심 노드 (수기/군자)
    ctx.beginPath();
    ctx.arc(cx, cy, 18, 0, Math.PI * 2);
    ctx.fillStyle = "#38bdf8";
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("나(修己)", cx, cy + 4);

    // 주변 구성원 노드 (정명 역할 배치)
    const roles = ["군(君)", "신(臣)", "부(父)", "자(子)", "형(兄)", "제(弟)", "붕우", "약자", "이웃", "백성", "타인", "만민"];
    roles.forEach((role, i) => {
      const tier = i < 4 ? 0.28 : (i < 8 ? 0.62 : 0.95);
      const ang = (i / roles.length) * Math.PI * 2 + animTick * 0.004;
      const jitter = (100 - state.geukgi) * 0.35;
      const dist = Math.min(w, h) * 0.42 * tier + Math.sin(animTick * 0.05 + i) * jitter;
      const nx = cx + Math.cos(ang) * dist;
      const ny = cy + Math.sin(ang) * dist;
      const connected = dist <= radius * 1.08;

      if (connected) {
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(nx, ny);
        ctx.strokeStyle = state.geukgi >= 70 ? "rgba(56, 189, 248, 0.45)" : "rgba(251, 191, 36, 0.3)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(nx, ny, 13, 0, Math.PI * 2);
      ctx.fillStyle = connected ? (state.geukgi >= 70 ? "#1e3a8a" : "#78350f") : "#1e293b";
      ctx.strokeStyle = connected ? "#38bdf8" : "#475569";
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#e2e8f0";
      ctx.font = "11px sans-serif";
      ctx.fillText(role, nx, ny + 4);
    });
    ctx.textAlign = "start";

    updateMetrics([
      { k: "인(仁)의 분별적 확장", v: `${state.renRadius}%`, c: "#4ade80" },
      { k: "극기복례·정명 일치도", v: `${state.geukgi}%`, c: "#38bdf8" },
      { k: "사회 상태", v: state.renRadius > 80 && state.geukgi > 75 ? "대동사회(大同)" : "수양 진행 중", c: "#fbbf24" }
    ]);
  } else {
    // 불교: 연기법(인드라망) 그물 & 삼독 vs 팔정도·열반적정
    const N = 16;
    const pts = [];
    const baseR = Math.min(w, h) * 0.34;
    const chaos = (state.samdok / 100) * (1 - state.paljeongdo / 130);

    for (let i = 0; i < N; i++) {
      const ang = (i / N) * Math.PI * 2 + animTick * 0.003;
      const offset = Math.sin(animTick * 0.08 + i * 1.7) * chaos * 45;
      pts.push({
        x: cx + Math.cos(ang) * (baseR + offset),
        y: cy + Math.sin(ang) * (baseR + offset)
      });
    }

    // 연기(인연) 연결망
    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {
        if ((j - i) % 3 === 1 || (j - i) === 1) {
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y);
          ctx.lineTo(pts[j].x, pts[j].y);
          ctx.strokeStyle = chaos > 0.35 ? "rgba(248, 113, 113, 0.35)" : "rgba(56, 189, 248, 0.35)";
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      }
    }

    // 자타불이·자비 파동
    const waveR = ((animTick * 1.5) % (baseR * 1.2)) * (state.jabi / 100);
    ctx.beginPath();
    ctx.arc(cx, cy, waveR, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(74, 222, 128, 0.45)";
    ctx.lineWidth = 2;
    ctx.stroke();

    pts.forEach((p, idx) => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = chaos > 0.35 ? "#f87171" : "#4ade80";
      ctx.fill();
    });

    ctx.fillStyle = "#fff";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(chaos > 0.35 ? "일체개고(삼독·집착)" : "열반적정·자타불이", cx, cy + 5);
    ctx.textAlign = "start";

    updateMetrics([
      { k: "삼독(탐·진·치) 번뇌", v: `${state.samdok}%`, c: "#f87171" },
      { k: "중도·팔정도 수행", v: `${state.paljeongdo}%`, c: "#38bdf8" },
      { k: "자타불이·자비 파동", v: `${state.jabi}%`, c: "#4ade80" }
    ]);
  }
}

// [커널 3: circuit] 윤리학 분류 & 맹자 사단 확충 회로도
function drawCircuitKernel(w, h) {
  const nodes = currentItem.nodes || [];
  const cols = 3, rows = 2;
  const padX = w * 0.16, padY = h * 0.28;
  const stepX = (w - padX * 2) / (cols - 1);
  const stepY = (h - padY * 2) / (rows - 1);

  const coords = nodes.map((label, idx) => {
    const r = Math.floor(idx / cols);
    const c = idx % cols;
    return { x: padX + c * stepX, y: padY + r * stepY, label };
  });

  // 배선 및 신호 펄스
  for (let i = 0; i < coords.length - 1; i++) {
    const a = coords[i], b = coords[i + 1];
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = "rgba(56, 189, 248, 0.4)";
    ctx.lineWidth = 3;
    ctx.stroke();

    const t = ((animTick * 0.025) + i * 0.2) % 1;
    const px = a.x + (b.x - a.x) * t;
    const py = a.y + (b.y - a.y) * t;
    ctx.beginPath();
    ctx.arc(px, py, 5, 0, Math.PI * 2);
    ctx.fillStyle = "#fbbf24";
    ctx.fill();
  }

  // 회로 노드 박스
  coords.forEach((nd, i) => {
    ctx.fillStyle = "#131b2e";
    ctx.strokeStyle = i % 2 === 0 ? "#38bdf8" : "#4ade80";
    ctx.lineWidth = 2;
    const bw = 155, bh = 54;
    ctx.beginPath();
    ctx.roundRect(nd.x - bw / 2, nd.y - bh / 2, bw, bh, 8);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(nd.label, nd.x, nd.y + 4);
  });
  ctx.textAlign = "start";

  const vals = Object.values(state);
  const avg = Math.round(vals.reduce((a, b) => a + b, 0) / (vals.length || 1));
  updateMetrics([
    { k: "회로 활성도", v: `${avg}%`, c: "#4ade80" },
    { k: "핵심 원리", v: currentItem.id === "mencius" ? "집의 → 호연지기" : "규범 vs 메타·기술", c: "#38bdf8" }
  ]);
}

  const gates = [

  ];

  const allPass = gates.every(g => g.pass);
  const startX = w * 0.18, endX = w * 0.82;
  const gap = (endX - startX) / 2;

  gates.forEach((g, idx) => {
    const gx = startX + idx * gap;
    ctx.strokeStyle = g.pass ? "#4ade80" : "#f87171";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(gx, h * 0.25);
    ctx.lineTo(gx, h * 0.72);
    ctx.stroke();

    ctx.fillStyle = "#131b2e";
    ctx.fillRect(gx - 75, h * 0.20, 150, 34);
    ctx.strokeRect(gx - 75, h * 0.20, 150, 34);

    ctx.fillStyle = g.pass ? "#4ade80" : "#f87171";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(g.name, gx, h * 0.20 + 21);
    ctx.fillText(g.pass ? "PASS (통과)" : "BLOCK (위반)", gx, h * 0.77);
  });

  // 준칙 입자 통과 애니메이션
  const pX = ((animTick * 3) % (w * 0.8)) + w * 0.1;
  let blockedX = w * 0.9;
  gates.forEach((g, idx) => {
    if (!g.pass && blockedX === w * 0.9) blockedX = startX + idx * gap;
  });
  const drawX = Math.min(pX, blockedX - 12);

  ctx.beginPath();
  ctx.arc(drawX, h * 0.48, 14, 0, Math.PI * 2);
  ctx.fillStyle = allPass ? "#4ade80" : "#fbbf24";
  ctx.fill();

  ctx.fillStyle = "#fff";
  ctx.font = "bold 14px sans-serif";
  ctx.fillText(allPass ? "✅ 정언명령 / 도덕 원리 최종 승인" : "❌ 도덕 법칙 위반 또는 반증 사례 검출", w * 0.5, h * 0.86);
  ctx.textAlign = "start";

  updateMetrics([
    { k: "게이트 1", v: gates[0].pass ? "통과" : "기각", c: gates[0].pass ? "#4ade80" : "#f87171" },
    { k: "게이트 2", v: gates[1].pass ? "통과" : "기각", c: gates[1].pass ? "#4ade80" : "#f87171" },
    { k: "최종 도덕 판단", v: allPass ? "도덕적 가치 O" : "재검토/기각", c: allPass ? "#4ade80" : "#f87171" }

}

// [커널 7: venn] 시민 불복종 3사상가 벤다이어그램 (소로·롤스·싱어)
function drawVennKernel(w, h) {
  const cx = w * 0.5, cy = h * 0.52;
  const R = Math.min(w, h) * 0.22;
  const passes = currentItem.gates ? currentItem.gates.map(g => g.check(state)) : [true, true, true];

  const circles = [
    { x: cx - R * 0.65, y: cy - R * 0.35, color: "rgba(56, 189, 248, 0.32)", stroke: "#38bdf8", name: "소로 (개인 양심 우위)", pass: passes[0] },
    { x: cx + R * 0.65, y: cy - R * 0.35, color: "rgba(74, 222, 128, 0.32)", stroke: "#4ade80", name: "롤스 (공유된 정의관)", pass: passes[1] },
    { x: cx, y: cy + R * 0.65, color: "rgba(192, 132, 252, 0.32)", stroke: "#c084fc", name: "싱어 (공리주의 이익계산)", pass: passes[2] }
  ];

  circles.forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, R, 0, Math.PI * 2);
    ctx.fillStyle = c.pass ? c.color : "rgba(30, 41, 59, 0.3)";
    ctx.fill();
    ctx.strokeStyle = c.pass ? c.stroke : "#475569";
    ctx.lineWidth = c.pass ? 3 : 1.5;
    ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(c.name, c.x, c.y + (c.y < cy ? -R * 0.45 : R * 0.55));
    ctx.fillStyle = c.pass ? "#4ade80" : "#f87171";
    ctx.fillText(c.pass ? "✓ 정당화 승인" : "✕ 조건 미충족", c.x, c.y + (c.y < cy ? -R * 0.25 : R * 0.75));
  });

  // 교집합 (처벌 수용 · 비폭력 · 공개성)
  ctx.fillStyle = "#fbbf24";
  ctx.font = "bold 12px sans-serif";
  ctx.fillText("★ 공통점: 처벌 수용", cx, cy + 4);
  ctx.fillText("비폭력·공동선", cx, cy + 20);
  ctx.textAlign = "start";

  updateMetrics([
    { k: "소로 / 롤스 / 싱어", v: `${passes[0] ? "O" : "X"} / ${passes[1] ? "O" : "X"} / ${passes[2] ? "O" : "X"}`, c: "#38bdf8" },
    { k: "공통 전제(처벌 수용)", v: `${state.acceptPunish}%`, c: "#fbbf24" }
  ]);
}

// [커널 8: scale] 예술과 윤리 양팔 저울 (도덕주의 vs 예술지상주의)
function drawScaleKernel(w, h) {
  const cx = w * 0.5, cy = h * 0.52;
  const beamW = Math.min(w * 0.62, 420);
  const diff = ((state.rightWeight - state.leftWeight) / 100) * (1 - state.harmony / 150);
  const angle = diff * 0.38;

  // 받침대 (공자 시·예·악 / 칸트 미는 도덕성의 상징)
  ctx.fillStyle = "#334155";
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx - 40, cy + 120);
  ctx.lineTo(cx + 40, cy + 120);
  ctx.closePath();
  ctx.fill();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  // 저울대
  ctx.strokeStyle = "#38bdf8";
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(-beamW / 2, 0);
  ctx.lineTo(beamW / 2, 0);
  ctx.stroke();

  // 좌우 접시
  [
    { x: -beamW / 2, label: "도덕주의(플라톤·톨스토이·순자)", wVal: state.leftWeight, c: "#4ade80" },
    { x: beamW / 2, label: "예술지상주의(와일드·스핑건)", wVal: state.rightWeight, c: "#c084fc" }
  ].forEach(pan => {
    ctx.beginPath();
    ctx.arc(pan.x, 45, 36, 0, Math.PI);
    ctx.fillStyle = pan.c;
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(pan.label, pan.x, -16);
    ctx.fillText(`${pan.wVal}%`, pan.x, 65);
  });
  ctx.restore();
  ctx.textAlign = "start";

  updateMetrics([
    { k: "저울 기울기", v: Math.abs(angle) < 0.08 ? "예악·미선 조화" : (angle < 0 ? "도덕주의 우위" : "순수예술론 우위"), c: "#fbbf24" },
    { k: "공자·칸트·정약용 조화도", v: `${state.harmony}%`, c: "#4ade80" }
  ]);
}

// [커널 9: ripple] 과학기술 & 요나스 책임윤리 파급 시뮬레이터
function drawRippleKernel(w, h) {
  const cx = w * 0.5, cy = h * 0.52;
  const maxR = Math.min(w, h) * 0.38;
  const gapRisk = Math.max(0, state.techSpeed - (state.jonasFear * 0.55 + state.citizenGov * 0.45));

  const zones = [
    { r: maxR * 0.35, label: "현세대 인간 (전통 호혜적 윤리)" },
    { r: maxR * 0.68, label: "자연 생태계 (하이데거 닦아세움 경계)" },
    { r: maxR * 1.0, label: "미래 세대 존속 (요나스 예견적·비호혜적 책임)" }
  ];

  zones.forEach((z, idx) => {
    ctx.beginPath();
    ctx.arc(cx, cy, z.r, 0, Math.PI * 2);
    ctx.strokeStyle = gapRisk > 35 ? "rgba(248, 113, 113, 0.55)" : "rgba(74, 222, 128, 0.5)";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = "#cbd5e1";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(z.label, cx, cy - z.r + 16);
  });

  // 기술 파동
  const wave = (animTick * (state.techSpeed / 25)) % maxR;
  ctx.beginPath();
  ctx.arc(cx, cy, wave, 0, Math.PI * 2);
  ctx.strokeStyle = gapRisk > 35 ? "#f87171" : "#38bdf8";
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.textAlign = "start";

  updateMetrics([
    { k: "윤리적 공백 위험도", v: `${Math.round(gapRisk)}%`, c: gapRisk > 35 ? "#f87171" : "#4ade80" },
    { k: "공포의 발견술·합의회의", v: `${state.jonasFear}% / ${state.citizenGov}%`, c: "#38bdf8" }
  ]);
}

// [커널 10: info] 정보사회(전자 파놉티콘) & AI 블랙박스·문해력
function drawInfoKernel(w, h) {
  const cx = w * 0.5, cy = h * 0.52;
  const shield = state.selfDeterm || 50;
  const surv = state.surveillance || 50;

  // 중앙 AI 블랙박스 / 파놉티콘 감시탑
  ctx.fillStyle = "#1e293b";
  ctx.strokeStyle = surv > shield ? "#f87171" : "#38bdf8";
  ctx.lineWidth = 3;
  ctx.strokeRect(cx - 45, cy - 45, 90, 90);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 12px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("전자 파놉티콘", cx, cy - 6);
  ctx.fillText("& AI 블랙박스", cx, cy + 12);

  // 정보 자기 결정권 방패 원
  ctx.beginPath();
  ctx.arc(cx, cy, 115, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(74, 222, 128, ${shield / 100})`;
  ctx.lineWidth = 4;
  ctx.setLineDash([8, 6]);
  ctx.stroke();
  ctx.setLineDash([]);

  particles.slice(0, 28).forEach((p, i) => {
    const ang = (i / 28) * Math.PI * 2 + animTick * 0.008;
    const dist = 155 + Math.sin(animTick * 0.05 + i) * 20;
    const px = cx + Math.cos(ang) * dist;
    const py = cy + Math.sin(ang) * dist;
    ctx.beginPath();
    ctx.arc(px, py, 6, 0, Math.PI * 2);
    ctx.fillStyle = state.aiLiteracy > 60 ? "#4ade80" : "#fbbf24";
    ctx.fill();
  });
  ctx.textAlign = "start";

  updateMetrics([
    { k: "파놉티콘·블랙박스 위험", v: `${surv}%`, c: "#f87171" },
    { k: "정보자기결정권·AI문해력", v: `${shield}% / ${state.aiLiteracy}%`, c: "#4ade80" }
  ]);
}

// [커널 11: market] 베블런 과시소비 vs 윤리적 소비·사회적 자본
function drawMarketKernel(w, h) {
  const cx = w * 0.5, cy = h * 0.52;
  const socialCap = Math.round((state.ethicalBuy + state.csrLevel - state.veblen * 0.5) / 1.5);

  // 좌(소비자) - 중앙(사회적 자본) - 우(생산자 기업)
  const boxes = [
    { x: w * 0.23, y: cy, title: "소비자 (보이콧·바이콧)", sub: `윤리적 소비 ${state.ethicalBuy}%`, c: "#38bdf8" },
    { x: cx, y: cy, title: "사회적 자본 (신뢰·호혜)", sub: `형성도 ${Math.max(0, socialCap)}%`, c: "#4ade80" },
    { x: w * 0.77, y: cy, title: "기업 생산자 (CSR)", sub: `사회적 책임 ${state.csrLevel}%`, c: "#fbbf24" }
  ];

  ctx.strokeStyle = state.veblen > 60 ? "#f87171" : "#4ade80";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(boxes[0].x, cy);
  ctx.lineTo(boxes[2].x, cy);
  ctx.stroke();

  boxes.forEach(b => {
    ctx.fillStyle = "#131b2e";
    ctx.strokeStyle = b.c;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.roundRect(b.x - 85, b.y - 42, 170, 84, 10);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(b.title, b.x, b.y - 6);
    ctx.fillStyle = b.c;
    ctx.fillText(b.sub, b.x, b.y + 16);
  });
  ctx.textAlign = "start";

  updateMetrics([
    { k: "베블런 과시·기호소비", v: `${state.veblen}%`, c: "#f87171" },
    { k: "사회적 자본 상생 지수", v: `${Math.max(0, socialCap)}%`, c: "#4ade80" }
  ]);
}

// [커널 12: culture] 다문화 그릇(용광로·국수대접·샐러드볼) & 포퍼 관용의 역설
function drawCultureKernel(w, h) {
  const cx = w * 0.5, cy = h * 0.55;
  const bw = Math.min(w * 0.55, 360), bh = 160;
  const mode = state.bowlMode ?? 80;
  const paradox = state.tolerance >= 90 && state.universalNorm < 40;

  // 그릇 외형
  ctx.beginPath();
  ctx.arc(cx, cy - 20, bw / 2, 0, Math.PI);
  ctx.strokeStyle = paradox ? "#f87171" : "#38bdf8";
  ctx.lineWidth = 5;
  ctx.stroke();

  // 국수 대접(34~66)일 때 주류 문화(국수 면발) 배경
  if (mode >= 34 && mode <= 66) {
    ctx.strokeStyle = "rgba(251, 191, 36, 0.45)";
    ctx.lineWidth = 3;
    for (let y = cy + 10; y < cy + 110; y += 16) {
      ctx.beginPath();
      for (let x = cx - bw * 0.38; x <= cx + bw * 0.38; x += 15) {
        const wy = y + Math.sin(x * 0.05 + animTick * 0.08) * 5;
        x === cx - bw * 0.38 ? ctx.moveTo(x, wy) : ctx.lineTo(x, wy);
      }
      ctx.stroke();
    }
  }

  // 문화 입자 렌더링
  const colors = ["#38bdf8", "#4ade80", "#fbbf24", "#c084fc"];
  particles.slice(0, 32).forEach((p, i) => {
    const ang = (i / 32) * Math.PI;
    const rad = (i % 5 + 1) * (bw * 0.075);
    const px = cx + Math.cos(ang + Math.sin(animTick * 0.02 + i)) * rad;
    const py = cy + 15 + (i % 4) * 26;

    ctx.beginPath();
    ctx.arc(px, py, mode >= 34 && mode <= 66 && i % 3 !== 0 ? 6 : 9, 0, Math.PI * 2);
    // 용광로면 단일 색상으로 흡수, 샐러드볼이면 각자 고유 색상 유지
    ctx.fillStyle = mode < 34 ? "#38bdf8" : (paradox && i < 6 ? "#ef4444" : colors[i % 4]);
    ctx.fill();
  });

  const modelName = mode < 34 ? "용광로 모델 (동화주의: 주류에 흡수)" : (mode <= 66 ? "국수 대접 모델 (주류 면 + 비주류 고명 위계)" : "샐러드 볼 모델 (대등한 조화·다양성)");
  ctx.fillStyle = paradox ? "#f87171" : "#fff";
  ctx.font = "bold 14px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(modelName, cx, cy - 45);
  if (paradox) {
    ctx.fillText("⚠️ 포퍼 '관용의 역설' 발생! (불관용·인권침해 문화 방치)", cx, cy - 70);
  }
  ctx.textAlign = "start";

  updateMetrics([
    { k: "현재 다문화 모델", v: mode < 34 ? "용광로" : (mode <= 66 ? "국수 대접" : "샐러드 볼"), c: "#38bdf8" },
    { k: "포퍼 관용 판정", v: paradox ? "관용의 역설 위험" : "분별 있는 관용", c: paradox ? "#f87171" : "#4ade80" }
  ]);
}

/* ============================================================================
   4. 스피드 OX 퀴즈 뷰 & JSON 무한 확장 뷰 & 실시간 검색
   ============================================================================ */
function renderQuizView() {
  const qc = document.getElementById("quizContainer");
  const sb = document.getElementById("sidebar");
  const cp = document.getElementById("controlPanel");
  sb.innerHTML = `<div class="cat-title">실전 대비 OX</div><div style="font-size:0.8rem;color:var(--muted);padding:6px;">두 PDF 시험범위의 모든 핵심 함정 선지를 즉시 점검합니다.</div>`;
  cp.innerHTML = `<div class="panel-box"><h3>📊 학습 가이드</h3><p style="font-size:0.8rem;color:#cbd5e1;line-height:1.5;">문제를 풀면 즉시 해설과 사상가 비교 포인트가 표시됩니다.</p></div>`;

  qc.innerHTML = `<h2 style="margin-bottom:14px;color:var(--accent);">⚡ 시험 범위 전 문항 스피드 개념 체크 (OX)</h2>`;
  ETHOS_DB.quizzes.forEach((qz, idx) => {
    const card = document.createElement("div");
    card.className = "quiz-card";
    card.innerHTML = `
      <div style="font-size:0.74rem;color:var(--accent);font-weight:700;">[${qz.cat}] 문항 #${idx + 1}</div>
      <div class="quiz-q">${qz.q}</div>
      <div class="quiz-actions">
        <button class="ox-btn" data-ans="O">O</button>
        <button class="ox-btn" data-ans="X">X</button>
      </div>
      <div class="quiz-exp" id="exp_${idx}">💡 <b>정답: ${qz.a}</b> — ${qz.exp}</div>
    `;
    card.querySelectorAll(".ox-btn").forEach(btn => {
      btn.onclick = () => {
        const isCorrect = btn.dataset.ans === qz.a;
        btn.classList.add(isCorrect ? "correct" : "wrong");
        document.getElementById(`exp_${idx}`).style.display = "block";
      };
    });
    qc.appendChild(card);
  });
}

function renderExtendView() {
  const cp = document.getElementById("controlPanel");
  const sample = {
    id: "custom_singer", mode: "modern", category: "추가 진도: 해외 원조 윤리",
    title: "싱어 vs 롤스 해외 원조 시뮬레이터", hanja: "海外援助·功利·正義", kernel: "scale", badge: "신규추가",
    desc: "진도가 추가될 때 JSON 객체만 넣으면 제어판과 캔버스가 자동 생성됩니다.",
    hanjaList: [{ k: "이익 평등 고려(싱어)", m: "인류의 고통 감소를 위한 원조 의무" }],
    controls: [
      { id: "leftWeight", label: "싱어: 공리주의적 전 지구적 원조", min: 0, max: 100, val: 80 },
      { id: "rightWeight", label: "롤스: 질서 정연한 사회 입문 지원", min: 0, max: 100, val: 70 },
      { id: "harmony", label: "보편적 인권 보호", min: 0, max: 100, val: 85 }
    ],
    points: ["<b>확장 완료</b>: 새로운 시험 범위가 즉시 시뮬레이터에 등록되었습니다."]
  };

  cp.innerHTML = `
    <div class="panel-box">
      <h3>➕ 새로운 시험 범위 JSON 주입</h3>
      <p style="font-size:0.78rem;color:var(--muted);margin-bottom:8px;">진도가 추가되면 아래 JSON 양식으로 사상가·쟁점을 붙여넣고 [모듈 즉시 추가]를 누르세요.</p>
      <textarea class="json-input" id="jsonInput">${JSON.stringify(sample, null, 2)}</textarea>
      <button class="preset-btn" id="addJsonBtn" style="width:100%;margin-top:8px;padding:9px;font-weight:700;">🚀 시뮬레이터에 모듈 즉시 추가</button>
    </div>
  `;
  document.getElementById("addJsonBtn").onclick = () => {
    try {
      const obj = JSON.parse(document.getElementById("jsonInput").value);
      ETHOS_DB.items.push(obj);
      selectMode(obj.mode || "modern");
      selectItem(obj.id);
    } catch (e) {
      alert("JSON 형식을 확인해주세요: " + e.message);
    }
  };
}

// 상단 탭 및 실시간 한자·사상가 검색 연결
document.querySelectorAll(".nav-tab").forEach(btn => {
  btn.addEventListener("click", () => selectMode(btn.dataset.mode));
});

const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");
searchInput.addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { searchResults.style.display = "none"; return; }
  const matches = ETHOS_DB.items.filter(it =>
    it.title.toLowerCase().includes(q) ||
    (it.hanja && it.hanja.toLowerCase().includes(q)) ||
    it.desc.toLowerCase().includes(q) ||
    (it.hanjaList || []).some(h => h.k.toLowerCase().includes(q) || h.m.toLowerCase().includes(q)) ||
    (it.points || []).some(p => p.toLowerCase().includes(q))
  );
  searchResults.innerHTML = matches.length ? matches.map(m => `
    <div class="search-item" data-id="${m.id}" data-mode="${m.mode}">
      <b>${m.title}</b> <span style="font-size:0.72rem;color:var(--warn)">${m.hanja}</span>
      <div style="color:var(--muted);font-size:0.73rem;margin-top:2px;">${m.category}</div>
    </div>
  `).join("") : `<div class="search-item">검색 결과가 없습니다.</div>`;
  searchResults.style.display = "block";

  searchResults.querySelectorAll(".search-item[data-id]").forEach(el => {
    el.onclick = () => {
      selectMode(el.dataset.mode);
      selectItem(el.dataset.id);
      searchResults.style.display = "none";
      searchInput.value = "";
    };
  });
});

// 초기 구동
resizeCanvas();
selectMode("nature");
renderLoop();
</script>
